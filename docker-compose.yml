services:
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-innonest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-innonest-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-innonest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-innonest}"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/db/innonest.db}
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-string}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    volumes:
      - appdata:/app/db
      - uploads:/app/uploads

volumes:
  appdata:
  uploads:
  pgdata:
